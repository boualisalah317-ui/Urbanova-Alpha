<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBANOVA ALPHA | تيشرتات أوفر سايز فاخرة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .hero { 
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://picsum.photos/2000/1200?random=streetwear') center/cover no-repeat;
    }
    .gold { color: #d4af37; }
    .product-card { transition: all 0.4s; }
    .product-card:hover { transform: translateY(-12px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- Navbar -->
  <nav class="bg-black/90 backdrop-blur-md fixed w-full z-50 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 class="text-3xl font-bold tracking-wider">URBANOVA <span class="gold">ALPHA</span></h1>
      <div class="flex gap-8 text-lg">
        <a href="#shop" class="hover:text-amber-400 transition">المتجر</a>
        <a href="#" class="hover:text-amber-400 transition">مجموعاتنا</a>
        <a href="#" class="hover:text-amber-400 transition">كيفية الطباعة</a>
        <a href="#" class="hover:text-amber-400 transition">اتصل بنا</a>
      </div>
      <div class="flex items-center gap-6">
        <button onclick="toggleCart()" class="relative">
          <i class="fa-solid fa-bag-shopping text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-500 text-xs w-5 h-5 flex items-center justify-center rounded-full">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero h-screen flex items-center justify-center text-center">
    <div class="max-w-4xl mx-auto px-6">
      <h2 class="text-7xl md:text-8xl font-bold mb-6 tracking-tighter">URBANOVA ALPHA</h2>
      <p class="text-2xl mb-10 text-zinc-300">تيشرتات أوفر سايز • طباعة DTF فاخرة • ستايل لا يُقاوم</p>
      <a href="#shop" class="inline-block bg-amber-500 hover:bg-amber-600 text-black font-bold text-xl px-12 py-5 rounded-2xl transition">
        تسوق المجموعة الآن
      </a>
    </div>
  </section>

  <!-- Shop Section -->
  <section id="shop" class="max-w-7xl mx-auto px-6 py-20">
    <h2 class="text-5xl font-bold text-center mb-16">مجموعة أوفر سايز</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="products-grid">
      <!-- Products will be added by JS -->
    </div>
  </section>

  <!-- Delivery -->
  <section class="bg-zinc-900 py-16">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h3 class="text-3xl font-bold mb-10">نتعامل مع أفضل شركات التوصيل</h3>
      <div class="flex flex-wrap justify-center gap-12 text-3xl opacity-80">
        <div>يامال</div>
        <div>بريد الجزائر</div>
        <div>DZ Express</div>
        <div>Flash</div>
      </div>
    </div>
  </section>

  <!-- Cart Sidebar -->
  <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-96 bg-zinc-900 border-l border-zinc-700 transform translate-x-full transition-transform duration-300">
    <div class="p-6">
      <h3 class="text-2xl font-bold mb-6">سلة التسوق</h3>
      <div id="cart-items" class="space-y-6"></div>
      <div class="mt-8 pt-6 border-t border-zinc-700">
        <div class="flex justify-between text-xl mb-6">
          <span>المجموع:</span>
          <span id="cart-total" class="font-bold">0 دج</span>
        </div>
        <button onclick="checkout()" class="w-full bg-amber-500 text-black py-5 rounded-2xl font-bold text-lg">
          إتمام الطلب
        </button>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "تيشرت أوفر سايز أسود", price: 4500, img: "https://picsum.photos/600/600?random=1" },
      { id: 2, name: "تيشرت أوفر سايز أبيض", price: 4500, img: "https://picsum.photos/600/600?random=2" },
      { id: 3, name: "قميص DTF مطبوع", price: 5200, img: "https://picsum.photos/600/600?random=3" },
      { id: 4, name: "تيشرت رمادي أوفر", price: 4700, img: "https://picsum.photos/600/600?random=4" },
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(p => `
        <div class="product-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
          <img src="${p.img}" class="w-full h-96 object-cover">
          <div class="p-6">
            <h3 class="text-xl font-semibold">${p.name}</h3>
            <p class="text-amber-400 text-2xl mt-2">${p.price.toLocaleString('ar-DZ')} دج</p>
            <button onclick="addToCart(${p.id})" 
                    class="mt-6 w-full bg-white text-black py-4 rounded-2xl font-bold hover:bg-amber-400 transition">
              أضف إلى السلة
            </button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCart();
      alert(`✅ تم إضافة ${product.name} إلى السلة`);
    }

    function updateCart() {
      document.getElementById('cart-count').textContent = cart.length;
      const itemsDiv = document.getElementById('cart-items');
      itemsDiv.innerHTML = cart.map((item, index) => `
        <div class="flex gap-4">
          <img src="${item.img}" class="w-20 h-20 object-cover rounded-xl">
          <div class="flex-1">
            <p>${item.name}</p>
            <p class="text-amber-400">${item.price.toLocaleString('ar-DZ')} دج</p>
          </div>
          <button onclick="removeFromCart(${index})" class="text-red-500">✕</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').textContent = total.toLocaleString('ar-DZ') + " دج";
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function toggleCart() {
      document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
    }

    function checkout() {
      if(cart.length === 0) return alert("السلة فارغة");
      alert("🎉 تم توجيهك إلى صفحة الدفع\n(يمكن ربط Stripe أو CIB لاحقاً)");
      cart = [];
      updateCart();
      toggleCart();
    }

    // Initialize
    renderProducts();
  </script>
</body>
</html>
