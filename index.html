<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBANOVA ALPHA | تيشرتات أوفر سايز فاخرة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .hero {
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.9)), url('https://picsum.photos/2000/1200?random=streetlux') center/cover;
    }
    .gold-text { color: #d4af37; text-shadow: 0 0 20px rgba(212,175,55,0.5); }
    .logo-glow { filter: drop-shadow(0 0 25px #d4af37); }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- Navbar -->
  <nav class="bg-black/95 backdrop-blur-md fixed w-full z-50 border-b border-amber-900">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="https://i.ibb.co.com/your-logo-link-here" alt="URBANOVA ALPHA" class="h-14 logo-glow">
        <div>
          <h1 class="text-3xl font-bold tracking-widest gold-text">URBANOVA</h1>
          <p class="text-[10px] tracking-[3px] text-amber-400 -mt-1">ALPHA</p>
        </div>
      </div>
      
      <div class="flex gap-8 text-lg font-medium">
        <a href="#shop" class="hover:text-amber-400 transition">المتجر</a>
        <a href="#" class="hover:text-amber-400 transition">مجموعاتنا</a>
        <a href="#" class="hover:text-amber-400 transition">كيفية الطباعة</a>
        <a href="#" class="hover:text-amber-400 transition">اتصل بنا</a>
      </div>

      <button onclick="toggleCart()" class="relative text-2xl">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero h-screen flex items-center justify-center text-center">
    <div class="max-w-5xl mx-auto px-6">
      <img src="https://i.ibb.co.com/your-logo-link-here" alt="Logo" class="mx-auto h-32 mb-8 logo-glow">
      <h2 class="text-7xl md:text-8xl font-bold tracking-tighter gold-text mb-4">URBANOVA ALPHA</h2>
      <p class="text-2xl text-amber-300 mb-10">ستايل لا يُقاوم • طباعة DTF فاخرة • جودة عالمية</p>
      <a href="#shop" class="inline-block bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-bold text-2xl px-16 py-6 rounded-3xl hover:scale-105 transition">
        تسوق المجموعة الآن
      </a>
    </div>
  </section>

  <!-- Shop Section -->
  <section id="shop" class="max-w-7xl mx-auto px-6 py-20">
    <h2 class="text-5xl font-bold text-center mb-16 gold-text">مجموعتنا الفاخرة</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-10" id="products-grid">
      <!-- سيتم ملؤها بالجافاسكريبت -->
    </div>
  </section>

  <script>
    const products = [
      { id: 1, name: "تيشرت أوفر سايز أسود", price: 4500, img: "https://picsum.photos/600/700?random=10" },
      { id: 2, name: "تيشرت أوفر سايز أبيض", price: 4500, img: "https://picsum.photos/600/700?random=11" },
      { id: 3, name: "قميص DTF مطبوع فاخر", price: 5200, img: "https://picsum.photos/600/700?random=12" },
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(p => `
        <div class="group bg-zinc-900 rounded-3xl overflow-hidden border border-amber-900/30 hover:border-amber-400 transition-all">
          <img src="${p.img}" class="w-full h-96 object-cover group-hover:scale-105 transition">
          <div class="p-8">
            <h3 class="text-2xl font-semibold">${p.name}</h3>
            <p class="text-4xl font-bold gold-text mt-4">${p.price.toLocaleString('ar-DZ')} دج</p>
            <button onclick="addToCart(${p.id})" class="mt-8 w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-black py-5 rounded-2xl font-bold text-lg hover:brightness-110">
              أضف إلى السلة
            </button>
          </div>
        </div>
      `).join('');
    }

    // باقي الدوال (السلة) ...
    function addToCart(id) { /* ... نفس الكود السابق */ alert("تمت الإضافة"); }
    function toggleCart() { alert("سلة التسوق - سيتم تطويرها"); }

    renderProducts();
  </script>
</body>
</html>
