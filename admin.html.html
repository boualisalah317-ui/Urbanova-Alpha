<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBANOVA ALPHA - لوحة التحكم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-72 bg-black p-6">
      <h1 class="text-2xl font-bold mb-10">URBANOVA <span class="text-amber-400">ALPHA</span></h1>
      <div class="space-y-4">
        <a href="#" class="flex items-center gap-3 text-lg py-3 px-4 bg-zinc-900 rounded-2xl"><i class="fa-solid fa-box"></i> المنتجات</a>
        <a href="#" class="flex items-center gap-3 text-lg py-3 px-4 hover:bg-zinc-900 rounded-2xl"><i class="fa-solid fa-cart-shopping"></i> الطلبات</a>
        <a href="#" class="flex items-center gap-3 text-lg py-3 px-4 hover:bg-zinc-900 rounded-2xl"><i class="fa-solid fa-users"></i> العملاء</a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-10 overflow-auto">
      <h2 class="text-4xl font-bold mb-8">إدارة المنتجات</h2>
      
      <div class="bg-zinc-900 rounded-3xl p-8">
        <h3 class="text-2xl mb-6">إضافة منتج جديد</h3>
        <input id="name" placeholder="اسم المنتج" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
        <input id="price" type="number" placeholder="السعر (دج)" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
        <input id="img" placeholder="رابط الصورة" class="w-full bg-zinc-800 p-4 rounded-2xl mb-6">
        
        <button onclick="addProduct()" 
                class="bg-amber-500 text-black px-10 py-4 rounded-2xl font-bold">
          إضافة المنتج
        </button>
      </div>

      <div id="admin-products" class="mt-10 grid grid-cols-3 gap-6"></div>
    </div>
  </div>

  <script>
    let products = [];
    function addProduct() {
      const name = document.getElementById('name').value;
      const price = parseInt(document.getElementById('price').value);
      const img = document.getElementById('img').value || "https://picsum.photos/600/600?random=" + Math.floor(Math.random()*100);
      
      if(name && price) {
        products.push({id: Date.now(), name, price, img});
        renderAdminProducts();
        alert("تمت إضافة المنتج بنجاح");
      }
    }

    function renderAdminProducts() {
      document.getElementById('admin-products').innerHTML = products.map(p => `
        <div class="bg-zinc-900 rounded-3xl overflow-hidden">
          <img src="${p.img}" class="w-full h-64 object-cover">
          <div class="p-5">
            <h4>${p.name}</h4>
            <p class="text-amber-400">${p.price.toLocaleString('ar-DZ')} دج</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
